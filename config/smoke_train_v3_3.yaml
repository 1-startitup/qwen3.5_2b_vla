# Smoke-test config for single-GPU training-loop sanity check on the v3.3 Pi 0.5 path.
# Uses the same synthetic-dataloader monkey-patch as smoke/smoke_train_loop.py.

model:
  architecture: "qwen_3.5_2b_pi05_v3_3"
  vlm_model_id: "/home/labuser/models/Qwen3.5-2B"
  attn_implementation: "sdpa"
  freeze_vision_encoder: true
  freeze_vlm: true

action_head:
  action_expert_variant: "gemma_300m"
  hidden_dim: 1024
  num_layers: 18
  action_dim: 7
  action_horizon: 4
  chunk_size: 4
  max_state_dim: 32
  max_action_dim: 32
  beta_alpha: 1.5
  beta_beta: 1.0
  time_sampling_scale: 0.999
  time_sampling_offset: 0.001
  min_period: 0.004
  max_period: 4.0
  num_inference_steps: 2
  state_dim: 8
  tokenizer_max_length: 320
  image_resolution: [224, 224]
  empty_cameras: 1

dataset:
  name: "synthetic"
  image_size: [224, 224]
  batch_size: 1
  num_workers: 0
  prefetch_factor: 2
  tokenizer_padding_side: "right"
  tokenizer_max_length: 320
  prompt_style: "plain"
  image_resize_mode: "stretch"
  empty_cameras: 1
  shuffle: false
  drop_last: true

training:
  max_steps: 6
  eval_every: 3
  save_every: 6
  save_optimizer_state: false
  log_every: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true

  lr: 5.0e-5
  min_lr: 5.0e-5
  weight_decay: 1.0e-10
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 2

  ema_decay: 0.999
  ema_offload_to_cpu: true

  mixed_precision: "bf16"
  wandb_project: ""
  output_dir: "/tmp/pi05_v3_3_smoke_ckpt"

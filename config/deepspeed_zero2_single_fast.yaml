# Accelerate + DeepSpeed ZeRO-2 for SINGLE GPU, tuned for speed.
# No CPU offload: with LoRA + bs128 on RTX 5090 we have enough VRAM,
# and avoiding CPUAdam is both simpler and faster.
compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_multinode_launcher: standard
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: false
  zero_stage: 2
  zero_optimization:
    stage: 2
    allgather_partitions: true
    allgather_bucket_size: 200000000
    overlap_comm: true
    reduce_scatter: true
    reduce_bucket_size: 200000000
    contiguous_gradients: true
  bf16:
    enabled: true
downcast_bf16: "no"
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
